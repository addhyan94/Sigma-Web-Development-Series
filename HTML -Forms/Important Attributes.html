<!-- required — blank nahi chhod sakte -->
<input type="text" required>

<!-- placeholder — hint text -->
<input type="text" placeholder="Naam likho">

<!-- value — default value -->
<input type="text" value="Rahul">

<!-- disabled — use nahi kar sakte -->
<input type="text" disabled>

<!-- readonly — dekh sakte ho, badal nahi sakte -->
<input type="text" readonly value="Fixed Value">

<!-- maxlength — max characters -->
<input type="text" maxlength="10">

<!-- minlength — min characters -->
<input type="text" minlength="3">

<!-- autofocus — page load pe automatically focus -->
<input type="text" autofocus>

<!-- name — JS/backend mein identify karne ke liye -->
<input type="text" name="username">
