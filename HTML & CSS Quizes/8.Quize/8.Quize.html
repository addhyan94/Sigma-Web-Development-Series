<!-- Design the Website's Layout Using FlexBox -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nev-bar</title>
    <style>
        :root {
            --nevcolor: rgb(223 242 223 / 83%);
            --bt-firstcolor: rgb(210 239 210 / 66%);
            --text-color: rgb(255, 250, 250);
            --main-color: rgb(181 181 181 / 84%);
            --hover-BGcolor: rgb(185, 220, 135);
            --hover-text-color: #900b0b;
            --main2box-color: skyblue;
            --foot-color: rgb(148 154 145);
        }

        body {
            background-color: rgb(134, 143, 136);
            position: relative;
        }

        * {
            margin: 0;
            padding: 0;
        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: var(--nevcolor);
            padding: 10px 10px;
            position: sticky;
            top: 10px;

        }

        ul button {
            background-color: var(--bt-firstcolor);
            padding: 3px 5px;
            border-radius: 30px;
            box-shadow: 5px 5px 10px;
            /* box-shadow: 0px 2px 16px 2px; */
            

        }

        ul button:hover {
            background-color: var(--hover-BGcolor);
            color: var(--hover-text-color);
            cursor: pointer;
        }

        ul {
            justify-self: flex-end;
        }

        ul li {
            list-style: none;
            display: inline;
            padding: 2px;
            font-weight: bolder;
            color: var(--text-color);
            

        }

        .mylogo img {
            height: 47px;
            width: 179px;
            position: fixed;
            list-style: upper-alpha;
            left: 15px;
            top: 1px;

        }

        .mainbox {
            background-color: var(--main-color);
            /* display: flex; */
            padding: 20px;
            margin: 10px;
            width: 96vw;
            height: 99vmin;
            /* justify-self: center; */
            text-align: center;

        }

        .mbox {
            border: 1.5px solid black;
            height: 20vh;
            width: 90vh;


        }

        .mbox button {
            /* display: flex; */
            justify-content: center;
            align-items: center;
            background-color: rgb(75, 147, 201);
            padding: 3px 5px;
            font-weight: bold;
            /* border-radius: 30px; */
            /* box-shadow: 5px 5px 10px; */
            /* box-shadow: 0px 2px 16px 2px; */
        }


        .foot {
            background-color: var(--foot-color);
            padding: 5px;
            height: 108px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><button>Product ▼</button> </li>
                <li><button>Pricing ▼</button></li>
                <li><button>Resources ▼</button></li>
                <li><button>About us ▼</button></li>
            </ul>
            <div class="mylogo">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo.png" alt="Logo Image">
            </div>
        </nav>
    </header>
    <main>
        <div class="mainbox">
           
               
            <div class="versions-Box">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>
    </main>
    <footer>
        <div class="foot">&copy; CopyRight 2025
            <br>~~Addhyan Tiwari
        </div>
    </footer>
</body>

</html>
