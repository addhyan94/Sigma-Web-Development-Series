<!-- Create a button & Set its backgorund color to :
 . Green using css stylesheet  
 . blue using <style> tag
. pink using inline style
 -->

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Que 3</title>
    <style>
        button{
            background-color: blue;
        }
    </style>
 </head>
 <body>
    <button style="background-color: pink;">This is a Button</button>
 </body>
 </html>
