<!-- Without Using Br Tag , WAP Vertically Aligned Form Asking for Name , Gender , City , Pincode , Text Area ,  and Checkbox of a Useer .
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importent Information Quize </title>
</head>
<body>
    <h1>Fill All Information...</h1>
    <form action="post">
        <div>
            <label for="">Enter User Name 👇🏻</label>
        </div>
            <input type="text" required id="name" placeholder="Enter Your User Name ">
        <div>
            <input type="radio" required name="gender" id="mail">
            <label for="mail">Mail </label>
            <input type="radio" required name="gender" id="fimali">
            <label for="fimali">Fimile</label>
        </div>
        <div>
            <label for="City">Enter Your City 👇🏻</label>
        </div>
        <input type="text" required name="city" id="City" placeholder="Enter Your City ...">
        <div>
            <label for="pincode">Enter Your Pincode Number 👇🏻 </label>
        </div>
        <input type="number" required name="pincode" id="pincode" placeholder="Enter Pincode Number ...." >
        <div>
            <label for="commit">Enter Commit 👇🏻 </label>
        </div>
        <textarea name="commit" required id="commit" placeholder="Enter Commit......... "></textarea>
        <div>
            <input type="checkbox" required name="Click" id="click">
            <label for="click">Kya aapne Sab Fill Kiya hai ..? </label>
        </div>
        <div>
            <input type="submit" value="Submit Information">
            <input type="reset" value="Reset Information">
        </div>
    </form>

</body>
</html>
