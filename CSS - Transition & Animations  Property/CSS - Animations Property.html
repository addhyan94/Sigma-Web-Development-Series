<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations Property</title>
    <style>
.boxes{
    background-color: aquamarine;
    width: 50vw;
    height: 80vh;
           display: flex;
        justify-self: center;
        align-self: center;

}
.box{
    border-radius: 30px;
    width: 34px;
    height: 30px;
    background-color: rgb(20, 137, 137);
    text-align: center;
    /* animation-name: firstanimation;
    animation-duration: 2s;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
    animation-delay: 2s;
    animation-direction: alternate-reverse;
    animation-play-state: running; */

    /* animation: name duration timing-function delay iteration-count direction fill-mode; */
    animation: firstanimation 2s ease-in-out 1s infinite alternate forwards ;

}
@keyframes firstanimation {
    from{
        text-shadow: 5px 5px 9px  rgb(244, 3, 3);
        /* transform: translateX(500px); */
        background-color: rgb(0, 255, 8);
        /* background-color:darkmagenta; */
    }
    to{

        
        transform: translateX(345px) rotate(325deg) scale(2);
        background-color: rgb(255, 0, 238);
    }
}
    </style>
</head>
<body>
    <div class="boxes">
        <div class="box">
            box
        </div>
    </div>
</body>
</html>
