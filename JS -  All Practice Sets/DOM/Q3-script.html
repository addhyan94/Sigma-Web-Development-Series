<!-- Question => id="para" wale paragraph ka background color yellow karo aur fontSize 20px karo. -->
 <!DOCTYPE html>
<html>
<head><title>DOM Practice</title></head>
<body>

  <h1 id="heading">Purana Heading</h1>
  <p id="para">Main ek paragraph hun</p>
  <div id="box">Main ek box hun</div>
  <ul id="list"></ul>
  <p id="big">Main chhota hun</p>

  <script>
    let para = document.getElementById("para");
    para.style.backgroundColor="yellow";
    para.style.fontSize="20px";
  </script>
</body>
</html>
