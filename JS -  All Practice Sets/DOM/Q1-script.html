<!-- Question=>Preview mein ek <p id="msg">Hello</p> hai. JS se uska text "Namaste Duniya!" kar do. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Que-1</title>
</head>
<body>
    <p id="msg">Hello</p>
    <script>
        let msg = document.getElementById("msg")
        msg.innerText = "Namaste Duniya.."
    </script>
</body>
</html>
