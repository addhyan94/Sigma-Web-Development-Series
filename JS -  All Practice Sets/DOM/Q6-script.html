<!-- Question=> querySelector use karke id="big" wale p ka text "Main ab bada ho gaya!" karo aur fontSize 28px karo. -->

<!DOCTYPE html>
<html>
<head><title>DOM Practice</title></head>
<body>

  <h1 id="heading">Purana Heading</h1>
  <p id="para">Main ek paragraph hun</p>
  <div id="box">Main ek box hun</div>
  <ul id="list"></ul>
  <p id="big">Main chhota hun</p>

  <script>
    let txt = document.querySelector("#big");
    txt.textContent="Main ab bada ho gaya!"
    txt.style.fontSize="28px";
  </script>
</body>
</html>
