<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Page </title>
</head>
<body>
    <p>This is  UnOrder List 👇</p>
    <ul type="square">
        <li>Hello</li>
        <li>Hii</li>
        <li>Hey</li>
    </ul>
    <p>This is  Order List 👇</p>
    <ol type="i">
         <li>Hello</li>
        <li>Hii</li>
        <li>Hey</li>
    </ol>
</body>
</html>
