<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn UI page</title>
    <link rel="stylesheet" href="Login-UI.css">
</head>
<body>
    <section class="main-sec">
        <section>
            <section class="box1">
                <section class="left-sec">
                    <img src="Login-left-image.png" alt="">
                </section>
                <section class="right-sec">
                    <div class="main-box">
                        <div class="backbtn">
                            <button class="backbtnn" style="/* background-color: rgb(193, 230, 198); */">⇚</button>
                        </div>
                        <div class="txt1">
                           <h1> Log in</h1>
                        </div>
                        <div class="txt2">
                            <p>Don't have an account?</p><a href="#">Create an Account</a> 
                        </div>
                        <form action="none" method="post" class="form-box">
                            <label for="Email">Email Address</label>
                            <input class="email-inp" type="email" name="mail" id="Email" required placeholder="abc.@example.com">
                            <label for="pas">Password</label>
                            <input type="password" name="password" id="pass" required placeholder="Password">
                        </form>
                        <div class="txt3">
                            <p><a href="#">Forgot Password?</a></p>
                        </div>
                        <div class="login-btn">
                            <button>Log in</button>
                        </div>
                        <div class="checkbox-check">

                            <input type="checkbox" name="tick" id="check">
                            <label for="check">I agree to the <a href="#">Terms & Condition</a></label>
                        </div>
                        <div class=" break-line">
                            <hr class="line1">
                            <p>or</p>
                            <hr class="line2">
                        </div>
                        <div class="continue-btns-section">
                            <div class="google">

                            </div>
                            <div class="facebook">
                                
                            </div>
                        </div>
                    </div>

                </section>
            </section>
        </section>
    </section>
</body>
</html>
